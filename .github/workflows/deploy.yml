name: Deploy

on:
  workflow_dispatch:

jobs:
  #  1. Test 
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn gunicorn httpx pytest pytest-asyncio anyio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (advisory only)
        run: |
          pip install flake8 || true
          flake8 app/ --max-line-length=120 || true
        continue-on-error: true

      - name: Run tests
        run: |
          if [ -d tests ] && [ -n "$(ls tests/)" ]; then
            pytest tests/ -v
          else
            echo "No tests found - skipping"
          fi

  #  2. Build (validate / plan) 
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Generate ephemeral SSH key for validation
        run: |
          ssh-keygen -t rsa -b 4096 -N "" -f /tmp/validate_key
          echo "VALIDATE_PUBLIC_KEY=$(cat /tmp/validate_key.pub)" >> $GITHUB_ENV

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="public_key=${{ env.VALIDATE_PUBLIC_KEY }}" \
            -out=tfplan
        continue-on-error: true

  #  3. Deploy 
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      #  Generate persistent SSH key pair 
      - name: Generate SSH key pair
        run: |
          ssh-keygen -t rsa -b 4096 -N "" -f /tmp/deploy_key
          echo "SSH_PUBLIC_KEY=$(cat /tmp/deploy_key.pub)" >> $GITHUB_ENV
          chmod 600 /tmp/deploy_key

      #  Terraform: provision infrastructure 
      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="public_key=${{ env.SSH_PUBLIC_KEY }}"

      - name: Capture server IP
        id: tf_output
        working-directory: terraform
        run: |
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV
          echo "server_ip=${SERVER_IP}" >> $GITHUB_OUTPUT

      #  Wait for SSH to become available 
      - name: Wait for SSH
        run: |
          echo "Waiting for SSH on ${{ env.SERVER_IP }} ..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i /tmp/deploy_key \
                   ubuntu@${{ env.SERVER_IP }} "echo ok" 2>/dev/null; then
              echo "SSH is up"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 10s"
            sleep 10
          done
          echo "SSH never became available"
          exit 1

      #  Install Ansible 
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      #  Sync application source to the server 
      - name: Sync application source
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i /tmp/deploy_key \
              ubuntu@${{ env.SERVER_IP }} \
              "sudo mkdir -p /opt/app && sudo chown ubuntu:ubuntu /opt/app"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.github' \
            --exclude='terraform' \
            --exclude='ansible' \
            ./ ubuntu@${{ env.SERVER_IP }}:/opt/app/

      #  Ansible: configure and start the app 
      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook ansible/playbook.yml \
            -i "${{ env.SERVER_IP }}," \
            --private-key /tmp/deploy_key \
            -u ubuntu \
            -e "app_env=production"

      #  Self-verify: health check 
      - name: Self-verify health endpoint
        run: |
          SERVER_IP="${{ env.SERVER_IP }}"
          HEALTH_URL="http://${SERVER_IP}/health"
          echo "Checking ${HEALTH_URL} ..."

          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${HEALTH_URL}" || echo "000")
            echo "Attempt $i/12 - HTTP ${HTTP_CODE}"
            if echo "${HTTP_CODE}" | grep -qE '^[23][0-9]{2}$'; then
              echo "Health check passed (HTTP ${HTTP_CODE})"
              exit 0
            fi
            sleep 10
          done

          echo "ERROR: Health check failed after 12 attempts. Last HTTP code: ${HTTP_CODE}"
          echo "--- nginx error log ---"
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@${SERVER_IP} \
            "sudo tail -50 /var/log/nginx/error.log" || true
          echo "--- app service log ---"
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@${SERVER_IP} \
            "sudo journalctl -u app -n 50 --no-pager" || true
          exit 1

      #  Cleanup sensitive files 
      - name: Cleanup SSH keys
        if: always()
        run: |-
          rm -f /tmp/deploy_key /tmp/deploy_key.pub
