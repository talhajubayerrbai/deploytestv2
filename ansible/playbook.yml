---
- name: Configure and deploy FastAPI application
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    venv_dir: /opt/app/.venv
    app_user: ubuntu
    app_env: production
    gunicorn_workers: 4
    gunicorn_port: 8000

  tasks:

    #  System packages 

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3.11
          - python3.11-venv
          - python3.11-dev
          - python3-pip
          - nginx
          - curl
          - git
          - rsync
        state: present

    #  Application directory 

    - name: Ensure /opt/app is owned by ubuntu
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    #  Python virtual environment 

    - name: Create Python virtual environment
      become_user: "{{ app_user }}"
      command:
        cmd: python3.11 -m venv {{ venv_dir }}
        creates: "{{ venv_dir }}/bin/activate"

    - name: Upgrade pip inside venv
      become_user: "{{ app_user }}"
      command:
        cmd: "{{ venv_dir }}/bin/pip install --upgrade pip"

    - name: Install Python packages from requirements.txt (if present)
      become_user: "{{ app_user }}"
      shell: |
        if [ -f {{ app_dir }}/requirements.txt ]; then
          {{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt
        else
          echo "No requirements.txt found - installing defaults"
          {{ venv_dir }}/bin/pip install \
            fastapi uvicorn[standard] gunicorn \
            python-multipart httpx
        fi

    #  .env file 

    - name: Write .env file
      become_user: "{{ app_user }}"
      shell: |
        cat > {{ app_dir }}/.env << 'ENVEOF'
        APP_ENV={{ app_env }}
        PORT={{ gunicorn_port }}
        HOST=0.0.0.0
        ENVEOF
      args:
        executable: /bin/bash

    #  systemd service 

    - name: Write systemd service unit for app
      copy:
        dest: /etc/systemd/system/app.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=FastAPI application (gunicorn + uvicorn)
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=-{{ app_dir }}/.env
          ExecStart={{ venv_dir }}/bin/gunicorn app.main:app \
              -k uvicorn.workers.UvicornWorker \
              -w {{ gunicorn_workers }} \
              -b 0.0.0.0:{{ gunicorn_port }} \
              --access-logfile - \
              --error-logfile -
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=app

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and (re)start app service
      systemd:
        name: app
        enabled: true
        state: restarted

    #  nginx 

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Write nginx site config
      copy:
        dest: /etc/nginx/sites-available/app
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              client_max_body_size 20M;

              location / {
                  proxy_pass         http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_set_header   Upgrade           $http_upgrade;
                  proxy_set_header   Connection        "upgrade";
                  proxy_read_timeout 120s;
                  proxy_connect_timeout 10s;
              }
          }

    - name: Enable nginx app site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Test nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Enable and restart nginx
      systemd:
        name: nginx
        enabled: true
        state: restarted

    #  Wait for app to be healthy 

    - name: Wait for app to respond on port 8000
      wait_for:
        host: 127.0.0.1
        port: "{{ gunicorn_port }}"
        timeout: 60
        delay: 3

    - name: Verify health endpoint via localhost
      uri:
        url: "http://127.0.0.1:{{ gunicorn_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_result
      retries: 6
      delay: 5
      until: health_result.status == 200